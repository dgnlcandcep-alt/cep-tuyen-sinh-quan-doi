services:
  - type: web
    name: cep-quan-doi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run render-start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        fromDatabase:
          name: cep-quan-doi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CEP_ADMIN_EMAILS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: cep-quan-doi-db
    plan: free
    databaseName: cep_quan_doi
    user: cep_app
